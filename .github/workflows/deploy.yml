yaml
name: Deploy to Lolipop FTP (Sign Store Map)
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'data.js'
      - 'ogp.jpg'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
concurrency:
  group: production-sign-map
  cancel-in-progress: true
jobs:
  web-deploy:
    name: Deploy to Lolipop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SIGN_MAP_DIR || secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/*.bak
            **/*.kmz
            **/extracted/**
            **/scratch/**
            **/ANTIGRAVITY.md
